<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部値・実効値計算｜お役立ちツール</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="site-logo">
                <span class="logo-main">Mysekai</span>
                <span class="logo-sub">周回お役立ちツール</span>
            </a>

            <button class="menu-button" id="menu-button">≡</button>
            <div class="header-menu" id="header-menu">

                <div class="menu-section">
                    <button class="menu-section-button">▼ 解説</button>
                    <div class="menu-items">
                        <a href="#" id="twitter-terms-button">📖 Twitter/X募集の用語について</a>
                        <a href="#" id="discord-guide-button">💬 Discordを使用した周回関連について</a>
                        <a href="index.html">😊 主に使われる周回中のスタンプについて</a>
                        <a href="#" id="support-guide-button">📊 支援編成、実効値などについて</a>
                    </div>
                </div>
                
                <div class="menu-section">
                    <button class="menu-section-button">▼ 実用</button>
                    <div class="menu-items">
                        <a href="template.html">📝 ツイ募集テンプレ</a>
                        <a href="encore.html">🎯 アンコール判断</a>
                        <a href="event.html">📈 イベントP・周回計算</a>
                        <a href="event_compare.html">⚖️ イベント編成比較</a>
                        <a href="internal.html">🧮 内部値・実効値計算</a>
                    </div>
                </div>
            </div>   
    </header>

    <!-- メイン -->
    <main class="main">
        <section class="tool-page">
            <!-- タイトル -->
            <div class="tool-page-header">
                <div class="hero-icon">🧮</div>
                <h1>内部値・実効値計算</h1>
                <p>
                    1～5枠の数値から<br>
                    内部値と実効値を計算します。
                </p>
            </div>

            <!-- 入力 -->
            <div class="tool-card">
                <h2>📝 スコアup値を入力</h2>
                <!-- 1枠 -->
                <div class="form-group">
                    <label for="value-1">
                        1枠（先頭）
                    </label>
                    <input
                        type="number"
                        id="value-1"
                        placeholder="例：150"
                        min="0"
                    >
                </div>

                <!-- 2枠 -->
                <div class="form-group">
                    <label for="value-2">
                        2枠
                    </label>
                    <input
                        type="number"
                        id="value-2"
                        placeholder="例：120"
                        min="0"
                    >
                </div>

                <!-- 3枠 -->
                <div class="form-group">
                    <label for="value-3">
                        3枠
                    </label>
                    <input
                        type="number"
                        id="value-3"
                        placeholder="例：110"
                        min="0"
                    >
                </div>

                <!-- 4枠 -->
                <div class="form-group">
                    <label for="value-4">
                        4枠
                    </label>
                    <input
                        type="number"
                        id="value-4"
                        placeholder="例：100"
                        min="0"
                    >
                </div>

                <!-- 5枠 -->
                <div class="form-group">
                    <label for="value-5">
                        5枠
                    </label>
                    <input
                        type="number"
                        id="value-5"
                        placeholder="例：80"
                        min="0"
                    >
                </div>

                <button
                    id="calculate-button"
                    class="tool-main-button"
                >
                    🧮 計算する
                </button>
            </div>

            <!-- 計算結果 -->
            <div
                id="internal-result"
                class="tool-card event-result"
            >
                <h2>
                    📊 計算結果
                </h2>

                <div class="event-result-grid">
                    <div class="event-result-item">
                        <span>
                            内部値
                        </span>
                        <strong id="internal-value">
                            -
                        </strong>
                    </div>

                    <div class="event-result-item">
                        <span>
                            実効値
                        </span>
                        <strong id="effective-value">
                            -
                        </strong>
                    </div>
                </div>
            </div>

            <!-- 戻る -->
            <div class="back-link-area">
                <a href="index.html">
                    ← メインページに戻る
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            お役立ちツール
        </p>
        <p class="copyright">
            © 2026
        </p>
    </footer>

    <script src="js/internal.js"></script>
    <script src="js/main.js"></script>
    <div class="image-modal" id="twitter-terms-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="twitter-terms-close">×</button>
            <img src="images/Twitter_text.png" alt="Twitter/X募集の用語">
        </div>
    </div>
    <div class="image-modal" id="discord-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="discord-guide-close">×</button>
            <img src="images/Discord_text.png" alt="Discordを使用した周回関連について">
        </div>
    </div>
    <div class="image-modal" id="support-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="support-guide-close">×</button>
            <img src="images/Sien_text.png" alt="支援編成・実効値について">
        </div>
    </div>
</body>
</html>
