<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツイ募集テンプレ｜お役立ちツール</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="site-logo">
                <span class="logo-main">Mysekai</span>
                <span class="logo-sub">周回お役立ちツール</span>
            </div>

            <button class="menu-button" id="menu-button">≡</button>
            <div class="header-menu" id="header-menu">

                <div class="menu-section">
                    <button class="menu-section-button">▼ 解説</button>
                    <div class="menu-items">
                        <a href="#" id="twitter-terms-button">📖 Twitter/X募集の用語について</a>
                        <a href="#" id="discord-guide-button">💬 Discordを使用した周回関連について</a>
                        <a href="index.html">😊 主に使われる周回中のスタンプについて</a>
                        <a href="#" id="support-guide-button">📊 支援編成、実効値などについて</a>
                    </div>
                </div>
                
                <div class="menu-section">
                    <button class="menu-section-button">▼ 実用</button>
                    <div class="menu-items">
                        <a href="template.html">📝 ツイ募集テンプレ</a>
                        <a href="encore.html">🎯 アンコール判断</a>
                        <a href="event.html">📈 イベントP・周回計算</a>
                        <a href="event_compare.html">⚖️ イベント編成比較</a>
                        <a href="internal.html">🧮 内部値・実効値計算</a>
                    </div>
                </div>
            </div>   
    </header>

    <!-- メイン -->
    <main class="main">
        <section class="tool-page">

            <div class="tool-page-header">
                <div class="hero-icon">📝</div>
                <h1>ツイ募集テンプレ</h1>
                <p>
                    周回募集に必要な情報を入力して、<br>
                    そのままXに投稿できます。
                </p>
            </div>

            <!-- 入力フォーム -->
            <div class="tool-card">
                <h2>募集内容</h2>

                <!-- 周回名 -->
                <div class="form-group">
                    <label for="round-name">
                        周回名
                    </label>

                    <select id="round-name">
                        <option value="🦐周回">
                            🦐周回
                        </option>
                        <option value="高速🦐周回">
                            高速🦐周回
                        </option>
                        <option value="ロスエン周回">
                            ロスエン周回
                        </option>
                        <option value="Sage周回">
                            Sage周回
                        </option>
                        <option value="ロスエンまたはSage周回">
                            ロスエンまたはSage周回
                        </option>
                        <option value="ビバハピ周回">
                            ビバハピ周回
                        </option>
                        <option value="おまかせ周回">
                            おまかせ周回
                        </option>
                        <option value="3DMV周回">
                            👗3DMV周回
                        </option>
                    </select>
                </div>

                <!-- 周回回数 --> 
                <div class="form-group"> 
                    <label for="round-count"> 
                        周回回数 
                    </label> 
                    <input 
                        type="text" 
                        id="round-count" 
                        placeholder="例：5回" >
                </div>

                <!-- 募集人数 -->
                <div class="form-group">
                    <label for="member-count">
                        募集人数
                    </label>
                    <input
                        type="number"
                        id="member-count"
                        placeholder="例：4"
                        min="1"
                    >
                </div>

                <!-- 部屋番号 -->
                <div class="form-group">
                    <label for="room-number">
                        🔑 部屋番号
                    </label>
                    <input
                        type="text"
                        id="room-number"
                        placeholder="例：12345"
                    >
                </div>


                <!-- 主 -->
                <div class="form-group">
                    <label for="host-value">
                        主
                    </label>
                    <input
                        type="text"
                        id="host-value"
                        placeholder="例：実効値200"
                    >
                </div>

                <!-- 募 -->
                <div class="form-group">
                    <label for="member-value">
                        募
                    </label>
                    <input
                        type="text"
                        id="member-value"
                        placeholder="例：実効値200"
                    >
                </div>

                <!-- 募集文 -->
                <div class="form-group">

                    <label for="template-text">
                        募集文
                    </label>

                    <textarea id="template-text">スタンプ他と同じ
sf、難易度気にしません
部屋主のおつさきにて解散
立て直し→もう一回+おつさき

#プロセカ募集 #プロセカ協力</textarea>

                    <p class="input-note">
                        ※募集文は自由に編集できます。
                    </p>
                </div>


                <!-- 作成ボタン -->
                <button
                    id="create-button"
                    class="tool-main-button"
                >
                    📝 募集文を作成
                </button>
            </div>

            <!-- 作成結果 -->
            <div
                class="tool-card result-card"
                id="result-area"
            >
                <h2>作成した募集文</h2>
                <textarea
                    id="result-text"
                    readonly
                ></textarea>

                <div class="result-buttons">
                    <button
                        id="copy-button"
                        class="tool-sub-button"
                    >
                        📋 コピー
                    </button>
                    <button
                        id="x-button"
                        class="tool-x-button"
                    >
                        𝕏 Xに送る
                    </button>
                </div>
            </div>


            <!-- 戻る -->
            <div class="back-link-area">
                <a href="index.html">
                    ← メインページに戻る
                </a>
            </div>
        </section>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <p>
            お役立ちツール
        </p>
        <p class="copyright">
            © 2026 
        </p>
    </footer>
    <script src="js/template.js"></script>
    <script src="js/main.js"></script>
    <div class="image-modal" id="twitter-terms-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="twitter-terms-close">×</button>
            <img src="images/Twitter_text.png" alt="Twitter/X募集の用語">
        </div>
    </div>
    <div class="image-modal" id="discord-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="discord-guide-close">×</button>
            <img src="images/Discord_text.png" alt="Discordを使用した周回関連について">
        </div>
    </div>
    <div class="image-modal" id="support-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="support-guide-close">×</button>
            <img src="images/Sien_text.png" alt="支援編成・実効値について">
        </div>
    </div>
</body>
</html>
