<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント編成比較｜お役立ちツール</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="site-logo">
                <span class="logo-main">Mysekai</span>
                <span class="logo-sub">周回お役立ちツール</span>
            </a>

            <button class="menu-button" id="menu-button">≡</button>
            <div class="header-menu" id="header-menu">

                <div class="menu-section">
                    <button class="menu-section-button">▼ 解説</button>
                    <div class="menu-items">
                        <a href="#" id="twitter-terms-button">📖 Twitter/X募集の用語について</a>
                        <a href="#" id="discord-guide-button">💬 Discordを使用した周回関連について</a>
                        <a href="index.html">😊 主に使われる周回中のスタンプについて</a>
                        <a href="#" id="support-guide-button">📊 支援編成、実効値などについて</a>
                    </div>
                </div>
                
                <div class="menu-section">
                    <button class="menu-section-button">▼ 実用</button>
                    <div class="menu-items">
                        <a href="template.html">📝 ツイ募集テンプレ</a>
                        <a href="encore.html">🎯 アンコール判断</a>
                        <a href="event.html">📈 イベントP・周回計算</a>
                        <a href="event_compare.html">⚖️ イベント編成比較</a>
                        <a href="internal.html">🧮 内部値・実効値計算</a>
                    </div>
                </div>
            </div>
        </div>   
    </header>

    <!-- メイン -->
    <main class="main">
        <section class="tool-page">
            <!-- タイトル -->
            <div class="tool-page-header">
                <div class="hero-icon">⚖️</div>
                <h1>イベント編成比較</h1>
                <p>
                    総合力とイベントボーナスから<br>
                    どちらの編成を使うとより良いのか比較します。<br> 
                    ※参考程度にお使いください      
                </p>
            </div>

            <!-- 編成① -->
            <div class="tool-card">
                <h2>編成①</h2>

                <div class="form-group">
                    <label for="power-1">
                        総合力
                    </label>
                    <input
                        type="text"
                        id="power-1"
                        placeholder="例：350,000"
                        inputmode="numeric"
                    >
                </div>

                <div class="form-group">
                    <label for="power-1">
                        イベントボーナス
                    </label>
                    <div class="input-with-unit">
                        <input
                            type="number"
                            id="bonus-1"
                            placeholder="例：300"
                            min="0"
                        >
                        <span>%</span>
                    </div>
                </div>
            </div>



            <!-- 編成② -->
            <div class="tool-card">
                <h2>編成②</h2>

                <div class="form-group">
                    <label for="power-2">
                        総合力
                    </label>
                    <input
                        type="text"
                        id="power-2"
                        placeholder="例：410,000"
                        inputmode="numeric"
                    >
                </div>

                <div class="form-group">
                    <label for="power-2">
                        イベントボーナス
                    </label>
                    <div class="input-with-unit">
                        <input
                            type="number"
                            id="bonus-2"
                            placeholder="例：250"
                            min="0"
                        >
                        <span>%</span>
                    </div>
                </div>
            </div>


            <!-- 計算ボタン -->
            <div class="tool-card">
                <button
                    id="compare-button"
                    class="tool-main-button"
                >
                    ⚖️ 比較する
                </button>
            </div>

            <!-- 結果 -->
            <div
                id="compare-result"
                class="tool-card compare-result"
            >
                <h2>📊 比較結果</h2>
                <div class="compare-summary">

                    <div class="compare-item">
                        <span>
                            編成①
                        </span>
                        <strong id="result-1">
                            -
                        </strong>
                    </div>

                    <div class="compare-item">
                        <span>
                            編成②
                        </span>
                        <strong id="result-2">
                            -
                        </strong>
                    </div>
                </div>

                <div class="compare-final">
                    <span>
                        🎯 判断結果
                    </span>
                    <strong id="result-message">
                        -
                    </strong>
                </div>
            </div>

            <!-- 戻る -->
            <div class="back-link-area">
                <a href="index.html">
                    ← メインページに戻る
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            お役立ちツール
        </p>
        <p class="copyright">
            © 2026
        </p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/event_compare.js"></script>
    <div class="image-modal" id="twitter-terms-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="twitter-terms-close">×</button>
            <img src="images/Twitter_text.png" alt="Twitter/X募集の用語">
        </div>
    </div>
    <div class="image-modal" id="discord-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="discord-guide-close">×</button>
            <img src="images/Discord_text.png" alt="Discordを使用した周回関連について">
        </div>
    </div>
    <div class="image-modal" id="support-guide-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="support-guide-close">×</button>
            <img src="images/Sien_text.png" alt="支援編成・実効値について">
        </div>
    </div>
</body>
</html>
